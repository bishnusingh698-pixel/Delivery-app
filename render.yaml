# Render Blueprint: one free web service. Database is Neon (external).
services:
  - type: web
    name: pickday
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders,write_orders,read_draft_orders,write_draft_orders,read_products,write_products,write_publications,read_locales,read_locations,read_themes,read_markets,write_validations,write_delivery_customizations
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JOBS_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: BILLING_TEST
        value: "false"
      - key: SHOPIFY_APP_HANDLE
        sync: false
