name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SHOPIFY_APP_URL: http://localhost
      - name: Storefront widget in a real browser (long text, RTL, phone width)
        run: npx tsx tests/browser/widget.browser.ts
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
      - name: Built widget assets are up to date
        run: git diff --exit-code -- extensions/pickday-theme/assets
