[[extensions]]
name = "Delivery date is tomorrow"
handle = "pickday-flow-upcoming"
type = "flow_trigger"
description = "Runs once a day for each order whose delivery, pickup or shipping date is tomorrow."

[settings]

  [[settings.fields]]
  type = "order_reference"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Method"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Date"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Time slot"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Pickup location"
