query Input($ruleTags: [String!], $ruleCollections: [ID!]) {
  buyerJourney {
    step
  }
  cart {
    attribute(key: "_pickday") {
      value
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    deliveryGroups {
      deliveryAddress {
        countryCode
        zip
        provinceCode
      }
    }
    lines {
      id
      quantity
      attribute(key: "_pickday") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          requiresShipping
          product {
            id
            isGiftCard
            hasTags(tags: $ruleTags) {
              tag
              hasTag
            }
            inCollections(ids: $ruleCollections) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  localization {
    language {
      isoCode
    }
    country {
      isoCode
    }
  }
  presentmentCurrencyRate
  shop {
    # Date only: hourly timeAfter checks cost 23 of Shopify's 30-point input limit (D-24).
    localTime {
      date
    }
  }
  validation {
    metafield(namespace: "$app:pickday", key: "config") {
      jsonValue
    }
  }
}
