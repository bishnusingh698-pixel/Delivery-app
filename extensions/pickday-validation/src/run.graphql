query Input($ruleTags: [String!], $ruleCollections: [ID!], $cutoffA: TimeWithoutTimezone!, $cutoffB: TimeWithoutTimezone!) {
  buyerJourney {
    step
  }
  cart {
    attribute(key: "_pickday") {
      value
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    deliveryGroups {
      deliveryAddress {
        countryCode
        zip
        provinceCode
      }
    }
    lines {
      id
      quantity
      attribute(key: "_pickday") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          requiresShipping
          product {
            id
            isGiftCard
            hasTags(tags: $ruleTags) {
              tag
              hasTag
            }
            inCollections(ids: $ruleCollections) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  localization {
    language {
      isoCode
    }
    country {
      isoCode
    }
  }
  presentmentCurrencyRate
  shop {
    # Date plus two checks at today's cut-off times (set at publish, D-24). Each timeAfter costs
    # 1 of Shopify's 30 input-query points: keep tests/function-query-cost.test.ts passing.
    localTime {
      date
      cutoffA: timeAfter(time: $cutoffA)
      cutoffB: timeAfter(time: $cutoffB)
    }
  }
  validation {
    metafield(namespace: "$app:pickday", key: "config") {
      jsonValue
    }
  }
}
