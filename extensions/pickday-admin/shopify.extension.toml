api_version = "2026-07"

# "Change delivery date" action on orders. Shopify allows one action target per extension and no
# block next to it: the draft order action is pickday-draft-action, the order page block is
# pickday-order-block (its button opens this action with navigate("extension:pickday-admin")).

[[extensions]]
name = "t:name"
handle = "pickday-admin"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/ScheduleAction.tsx"
target = "admin.order-details.action.render"
