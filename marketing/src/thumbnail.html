<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#3D86F5,#1747A0);color:#fff;position:relative}
.l{position:absolute;left:64px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:18px;font-weight:800;font-size:40px;margin-bottom:28px}
.brand img{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{font-family:"Inter Display",Inter,sans-serif;font-weight:900;font-size:100px;line-height:.98;letter-spacing:-.025em;margin:0}
h1 span{color:#FFB59C}
.sub{margin-top:26px;font-size:32px;font-weight:700;color:#dce8ff}
.card{position:absolute;right:50px;top:70px;width:500px;background:#fff;border-radius:26px;padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.35);transform:rotate(3deg)}
.card img{width:460px;display:block}
.pill{position:absolute;right:300px;bottom:70px;background:#ff6a3d;color:#fff;font-weight:800;font-size:30px;padding:14px 24px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.3);transform:rotate(-3deg)}
</style></head><body>
<div class="l"><div class="brand"><img src="../out/logo-1200.png">Pickday</div>
<h1>Let customers <span>pick the day</span></h1>
<div class="sub">Delivery &amp; pickup dates for your store</div></div>
<div class="card"><img src="../out/parts/w-hero.png"></div>
<div class="pill">Time slots + daily limits</div>
</body></html>
